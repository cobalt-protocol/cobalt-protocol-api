services:
  postgres:
    image: postgres:17-alpine
    container_name: cobalt-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cobalt
      POSTGRES_PASSWORD: cobalt_dev_password
      POSTGRES_DB: cobalt
    ports:
      - "5433:5432"
    volumes:
      - cobalt_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cobalt -d cobalt"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cobalt_postgres_data:
